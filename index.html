<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
	/>

	<title>reveal.js</title>

	<link rel="stylesheet" href="dist/reset.css" />
	<link rel="stylesheet" href="dist/reveal.css" />
	<link rel="stylesheet" href="dist/theme/black.css" />
	<link rel="stylesheet" href="dist/clocktower.css"/>

	<!-- Theme used for syntax highlighted code -->
	<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
</head>
<body>
<div class="reveal">
	<div id="role distribution" style="margin: 20px 20px">
		<h2>Round <span id="round number">1</span></h2>
		<ul style="list-style-type: none">
			<li id="Townsfolk">Townsfolk: ?</li>
			<li id="Outsiders">Outsiders: ?</li>
			<li id="Minions">Minions: ?</li>
			<li id="Demons">Demons: 1</li>
		</ul>
	</div>
	<div class="townsquare" id="townsquare" style="position: relative; width: 400px; height: 400px; margin: 50px auto;">
	</div>

	<div class="slides">
		<section>
			<h2>Blood on the Clocktower</h2>
		</section>
		<section>
			<h2>Night</h2>
		</section>
		<section>
			<h2>Day</h2>
			<h2 id="day countdown"></h2>
		</section>
		<section>
			<section>
				<h2>Nominations are open!</h2>
				<h3 style="display:inline"><span id="abouttodie">Nobody</span></h3> is about to die!
			</section>
			<section>
				<br>
				<h3><span id="nominator">A</span> nominates <span id="nominee">B</span>!</h3>
				<h2 style="display:inline"><span id="needed to tie number"></span></h2><h6 style="display:inline"><span id="needed to tie text"></span></h6>
				<h2 style="display:inline"><span id="needed to die number">?</span></h2><h6 style="display:inline"><span id="needed to die text"> votes to die.</span></h6>
				<br>
				<h1><span id="countdown"></span></h1>
			</section>
		</section>
		<section>
			<h2>Dusk</h2>
			<h3 style="display:inline"><span id="executee">A</span></h3> is executed!
		</section>
	</div>
</div>

<script src="dist/reveal.js"></script>
<script src="dist/plugin/notes.js"></script>
<script src="dist/plugin/markdown.js"></script>
<script src="dist/plugin/highlight.js"></script>
<script src="scripts/clocktower.js"></script>
</body>
</html>
