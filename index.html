<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css" />
		<link rel="stylesheet" href="dist/reveal.css" />
		<link rel="stylesheet" href="dist/theme/black.css" />

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section>Night <span id="night">1</span></section>
				<section>Day <span id="day">1</span></section>
				<section>Nomination</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="dist/plugin/notes.js"></script>
		<script src="dist/plugin/markdown.js"></script>
		<script src="dist/plugin/highlight.js"></script>
		<script>


			Reveal.initialize({
				hash: true,
				controls: true,
				keyboardCondition: 'focused',

				plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
			});

			window.addEventListener("message", event => {
				if(event.data.namespace !== "botc-control") return;

				if(event.data.type === "nextRound"){
					document.getElementById("night").innerText = 10;
					Reveal.right();
				}

				if(event.data.type === "startGame"){
					StartGame(event.data.data);
				}
			})

			let playerCount = 0;

			function StartGame(names){
				var namesList = names.split(",");
				namesList.forEach(element => {
					playerCount++;
				});
				document.getElementById("night").innerText = playerCount;
			}
		</script>
	</body>
</html>
